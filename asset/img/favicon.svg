<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00c882" />
      <stop offset="100%" stop-color="#007a4f" />
    </linearGradient>
  </defs>
  <!-- Rounded dark background matching theme -->
  <rect width="64" height="64" rx="16" fill="#141414"/>
  <!-- Subtle border with theme green -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#009e66" stroke-width="2" stroke-opacity="0.4"/>
  <!-- Stylized B monogram / Code brackets aesthetic -->
  <text x="50%" y="54%" text-anchor="middle" dominant-baseline="central" fill="url(#brandGrad)" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="36" letter-spacing="-1">B</text>
  <circle cx="45" cy="19" r="4" fill="#00e695"/>
</svg>
